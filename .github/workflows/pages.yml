name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fetch want-list VRMs (same-origin; release assets block cross-origin WebGL)
        run: node scripts/fetch-want-vrms.mjs
      - name: static export build
        run: pnpm --filter @amoji/web build
        env:
          AMOJI_EXPORT: "1"
          AMOJI_BASE_PATH: /amoji-app
          NEXT_PUBLIC_BASE_PATH: /amoji-app
          # Optional public Edge relay (Actions variable, not a secret). Empty → direct socket.
          NEXT_PUBLIC_TTS_PROXY: ${{ vars.AMOJI_TTS_PROXY }}
          NEXT_PUBLIC_EDGE_TTS_TOKEN: ${{ vars.AMOJI_EDGE_TTS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
