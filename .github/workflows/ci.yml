name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm --filter @amoji/web build
      - name: asset manifest check
        run: |
          # Mirrors the manifest's own contract: every binary at the top level
          # OR under cast/ must be listed. The old glob only covered the top
          # level, so a cast/ binary could ship unmanifested.
          fail=0
          for f in apps/web/public/models/*.vrm apps/web/public/models/cast/*.vrm; do
            [ -e "$f" ] || continue
            grep -q "$(basename "$f")" apps/web/public/models/ASSET_MANIFEST.md || { echo "unmanifested asset: $f"; fail=1; }
          done
          exit $fail
      - name: vrm structural check
        run: node scripts/check-vrm.mjs apps/web/public/models/juno.vrm
      - name: banned asset check
        run: |
          # The old check only listed the top level, so a banned binary could
          # sit in cast/ and still pass. Scan the whole tree.
          if find apps/web/public/models -iname '*marin*' | grep -q .; then
            echo "banned asset present:"; find apps/web/public/models -iname '*marin*'
            exit 1
          fi
