name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm --filter @amoji/web build
      - name: asset manifest check
        run: |
          # Mirrors the manifest's own contract: every binary at the top level
          # OR under cast/ must be listed. The old glob only covered the top
          # level, so a cast/ binary could ship unmanifested.
          fail=0
          for f in apps/web/public/models/*.vrm apps/web/public/models/cast/*.vrm; do
            [ -e "$f" ] || continue
            grep -q "$(basename "$f")" apps/web/public/models/ASSET_MANIFEST.md || { echo "unmanifested asset: $f"; fail=1; }
          done
          exit $fail
      - name: vrm structural check
        run: node scripts/check-vrm.mjs apps/web/public/models/juno.vrm
      - name: banned asset check
        run: |
          # The old check only listed the top level, so a banned binary could
          # sit in cast/ and still pass. Scan the whole tree.
          if find apps/web/public/models -iname '*marin*' | grep -q .; then
            echo "banned asset present:"; find apps/web/public/models -iname '*marin*'
            exit 1
          fi

      # This job's `pnpm --filter @amoji/web build` above is a server build
      # (no AMOJI_EXPORT), so it produces no out/ and no store bundle. The two
      # static builds below are the ones that can actually ship.
      #
      # 1) Store bundle (AMOJI_APP=1): App Store / Play Store wrapper payload.
      #    No internal QA pages, no adult-content strings anywhere in out/.
      - name: store bundle build (AMOJI_APP=1)
        run: pnpm --filter @amoji/web build:app
      - name: store bundle gate
        run: node scripts/check-store-bundle.mjs apps/web/out --store
      - name: store bundle ships no internal QA pages
        run: |
          for f in catalog.html decisions.html gallery.html voice-debug.html; do
            if [ -e "apps/web/out/$f" ]; then
              echo "internal QA page shipped in store bundle: $f"
              exit 1
            fi
          done
          echo "ok: no internal QA pages in store bundle"

      # 2) GitHub Pages build: must be UNCHANGED, i.e. the QA pages it has always
      #    served must still be there. This is the regression guard for the move
      #    of those files out of public/.
      - name: pages build still ships the QA pages
        run: pnpm --filter @amoji/web build
        env:
          AMOJI_EXPORT: "1"
          AMOJI_BASE_PATH: /amoji-app
          NEXT_PUBLIC_BASE_PATH: /amoji-app
      - name: pages build keeps its QA pages
        run: |
          for f in catalog.html decisions.html gallery.html voice-debug.html; do
            [ -e "apps/web/out/$f" ] || { echo "web build lost QA page: $f"; exit 1; }
          done
          node scripts/check-store-bundle.mjs apps/web/out
